<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI 셀러 비서</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: #f4f7f6; color: #13241f; text-align: center; }
    .box { padding: 32px 24px; max-width: 320px; }
    .logo { width: 72px; height: 72px; border-radius: 20px; background: linear-gradient(135deg, #1f7a5c, #0f4f3c); margin: 0 auto 18px; display: grid; place-items: center; color: #fff; font-size: 30px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #6b7d76; font-size: 15px; line-height: 1.6; margin: 0 0 22px; }
    button { border: 0; border-radius: 14px; background: #17634c; color: #fff; font-size: 16px; font-weight: 600; padding: 14px 28px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">✦</div>
    <h1>연결할 수 없어요</h1>
    <p>인터넷 연결을 확인한 뒤<br>다시 시도해 주세요.</p>
    <button onclick="location.reload()">다시 시도</button>
  </div>
</body>
</html>
